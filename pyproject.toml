[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableplus-db"
version = "0.1.0"
description = "Open a project's local database in TablePlus"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sean Washington" }]
classifiers = [
    "Environment :: MacOS X",
    "Programming Language :: Python :: 3",
]

[project.scripts]
db = "db_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["db_cli"]
